plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
}

group = 'ai.seeker'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

application {
    mainClass = 'ai.App'
}

checkstyle {
    toolVersion = '10.12.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxErrors = 0
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free Seeker self tests.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ai.SelfTest'
}

jar {
    manifest {
        attributes 'Main-Class': 'ai.App'
    }
}
